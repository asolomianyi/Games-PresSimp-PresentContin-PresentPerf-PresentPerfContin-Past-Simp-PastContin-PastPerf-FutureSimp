<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tense Games — повторення часів</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#6a7387;--line:#dde2ee;--ok:#16a34a;--bad:#dc2626;--okbg:#dcfce7;--badbg:#fee2e2;--t0:#4f46e5;--t1:#e11d74;--t2:#0d9488;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1c2130;--text:#eef1f8;--muted:#9aa3b8;--line:#2e3548;--okbg:#14351f;--badbg:#3d1a1a;--t0:#818cf8;--t1:#f472b6;--t2:#2dd4bf;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:1.9rem}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:1rem}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
.chips,.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip,.seg button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.95rem}
.chip.on,.seg button.on{background:var(--t0);border-color:var(--t0);color:#fff}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mode{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);text-align:left;cursor:pointer;font-size:.95rem}
.mode b{display:block;font-size:1.15rem;margin-bottom:2px}
.mode.on{border-color:var(--t0);box-shadow:0 0 0 3px color-mix(in srgb,var(--t0) 25%,transparent)}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.nm small{color:var(--muted)}
.big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--t0);color:#fff;font-size:1.1rem;font-weight:600;cursor:pointer}
.big:disabled{opacity:.4;cursor:not-allowed}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.team{padding:10px;border-radius:12px;background:var(--card);border:3px solid var(--line);text-align:center}
.team b{display:block;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team span{font-size:1.6rem;font-weight:700}
.team.act{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.team.ban{opacity:.45}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;width:100%;background:var(--t0)}
.q{font-size:1.6rem;font-weight:600;margin:14px 0 10px;text-align:center}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--t0)}
.status{text-align:center;font-weight:600;min-height:1.6em;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opts.g{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.opt{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:1.15rem;cursor:pointer;text-align:left}
.opt:disabled{opacity:.6;cursor:default}
.opt:hover:not(:disabled){border-color:var(--t0)}
.opt.ok{background:var(--okbg);border-color:var(--ok);opacity:1}
.opt.bad{background:var(--badbg);border-color:var(--bad);opacity:1}
.fb{margin-top:14px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.tag{display:inline-block;background:var(--t0);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;margin-right:6px}
code{background:var(--card);padding:1px 6px;border-radius:5px}
.buzz{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.bz{padding:22px 8px;border:0;border-radius:16px;color:#fff;font-size:1.1rem;font-weight:700;cursor:pointer;background:var(--c)}
.bz small{display:block;opacity:.85;font-weight:500}
.bz:disabled{opacity:.3;cursor:default}
.ctl{display:flex;gap:10px}
.ctl button,.menu{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;cursor:pointer}
.menu{flex:none;padding:6px 12px;float:right;font-size:.9rem}
.hide{display:none}
.win{text-align:center;font-size:1.6rem;font-weight:700;margin:6px 0 14px}
table{width:100%;border-collapse:collapse;font-size:.92rem}td{padding:6px 4px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<button class="menu hide" id="menu">☰ Меню</button>
<h1>🎓 Tense Games</h1>
<p class="sub">Повторення англійських часів · 3 команди</p>

<div id="setup">
 <div class="card"><h3>Оберіть гру</h3>
  <div class="modes" id="modes">
   <button class="mode on" data-m="quest"><b>🎯 Tense Quest</b>Команди відповідають по черзі, є таймер і бонуси за швидкість.</button>
   <button class="mode" data-m="buzz"><b>🔔 Tense Buzzer</b>Хто перший натисне кнопку, той відповідає. 25 речень.</button>
  </div></div>
 <div class="card"><h3>Команди</h3><div class="names" id="names"></div></div>
 <div id="qopt">
  <div class="card"><h3>Часи</h3><div class="chips" id="tenses"></div></div>
  <div class="card"><div class="row">
   <div><h3>Питань</h3><div class="seg" id="cnt"><button data-v="12">12</button><button class="on" data-v="24">24</button><button data-v="39">39</button></div></div>
   <div><h3>Секунд на відповідь</h3><div class="seg" id="tm"><button data-v="10">10</button><button class="on" data-v="20">20</button><button data-v="40">40</button></div></div>
  </div></div>
 </div>
 <button class="big" id="start">Почати гру</button>
</div>

<div id="qgame" class="hide">
 <div class="score" id="qScore"></div>
 <div class="meta"><span id="qProg"></span><span id="qLeft"></span></div>
 <div class="bar"><i id="qBar"></i></div>
 <div class="card">
  <div class="meta"><span id="qTurn"></span><span id="qStreak"></span></div>
  <div class="q" id="qQ"></div>
  <div class="opts" id="qOpts"></div>
  <div class="fb hide" id="qFb"></div>
 </div>
 <button class="big hide" id="qNext">Далі →</button>
</div>

<div id="bgame" class="hide">
 <div class="score" id="bScore"></div>
 <div class="meta"><span id="bProg"></span><span id="bLeft"></span></div>
 <div class="card">
  <div class="q" id="bQ"></div>
  <div class="status" id="bStatus"></div>
  <div class="bar hide" id="bBarw"><i id="bBar"></i></div>
  <div class="opts g" id="bOpts"></div>
  <div class="fb hide" id="bFb"></div>
 </div>
 <div class="buzz" id="bBuzz"></div>
 <div class="ctl"><button id="bSkip">⏭ Показати відповідь</button><button id="bNext" class="hide">Далі →</button></div>
</div>

<div id="end" class="hide">
 <div class="card"><div class="win" id="winner"></div><div class="score" id="fScore"></div></div>
 <div class="card hide" id="statCard"><h3>Статистика за часами (правильні відповіді)</h3><table id="stats"></table></div>
 <button class="big" id="again">Зіграти ще раз</button>
</div>
</div>

<script>
var T=[
{n:"Present Simple",f:"V1 / V1+s · do/does + V1"},
{n:"Present Continuous",f:"am/is/are + V-ing"},
{n:"Present Perfect",f:"have/has + V3"},
{n:"Present Perfect Continuous",f:"have/has been + V-ing"},
{n:"Past Simple",f:"V2 · did + V1"},
{n:"Past Continuous",f:"was/were + V-ing"},
{n:"Past Perfect",f:"had + V3"},
{n:"Future Simple",f:"will + V1"}
];
var QQ=[
[0,"Our school ___ at 8:30, so we have to leave home early.",["starts","is starting","has started"],0,"Розклад / регулярність → Present Simple."],
[0,"He rarely ___ his phone during lessons.",["checks","is checking","has checked"],0,"rarely — частотний прислівник → Present Simple."],
[0,"How often ___ you visit your grandparents?",["do","did","are"],0,"how often + do/does + підмет + V1."],
[0,"My mum ___ in a hospital. She is a doctor.",["works","is working","worked"],0,"Постійна робота → Present Simple."],
[0,"The museum ___ at 6 p.m. on Sundays.",["closes","is closing","has closed"],0,"Постійний розклад → Present Simple."],
[1,"I can’t talk now. I ___ for my chemistry test.",["study","am studying","have studied"],1,"now — дія триває зараз → Present Continuous."],
[1,"Look at those children! They ___ in the park.",["play","are playing","played"],1,"Look! — дія відбувається зараз → Present Continuous."],
[1,"Why are you ___ so loudly? I’m trying to concentrate!",["laugh","laughing","laughed"],1,"are + V-ing."],
[1,"My sister ___ a book at the moment.",["reads","is reading","has read"],1,"at the moment → Present Continuous."],
[1,"Listen! Someone ___ in the next room.",["sings","is singing","sang"],1,"Listen! — дія відбувається зараз → Present Continuous."],
[2,"I have never ___ to a rock concert.",["been","go","went"],0,"never + have + V3 — життєвий досвід."],
[2,"I ___ my homework. Now I can watch TV.",["have finished","am finishing","finishing"],0,"Результат є зараз → have + V3."],
[2,"She ___ here for three years, and she loves it.",["has lived","lived","is living"],0,"for three years (досі) → has + V3."],
[2,"I haven’t finished my essay ___.",["yet","already","ago"],0,"yet — у запереченнях та питаннях з Present Perfect."],
[2,"This is the best pizza I have ever ___.",["eaten","ate","eat"],0,"Найвищий ступінь + ever → Present Perfect (V3)."],
[3,"My eyes hurt because I ___ at the screen all day.",["have been staring","stare","stared"],0,"Тривала дія з видимим результатом → have been + V-ing."],
[3,"How long have you been ___ for the exam?",["prepare","preparing","prepared"],1,"How long + have been + V-ing."],
[3,"They ___ the new bridge since January, and it’s still not ready.",["have been building","built","are building"],0,"since January + дія триває → Present Perfect Continuous."],
[3,"She’s tired. She ___ in the gym for two hours.",["has been training","trains","trained"],0,"for two hours + наслідок зараз."],
[3,"We ___ about this problem for ages, and we still have no solution.",["have been discussing","discuss","discussed"],0,"for ages — тривалість до зараз."],
[4,"We ___ the final match on TV last Sunday.",["watched","have watched","were watching"],0,"last Sunday — конкретний час у минулому → Past Simple."],
[4,"When did you first ___ about this app?",["hear","heard","hearing"],0,"did + V1."],
[4,"I ___ my phone on the bus yesterday and I was very upset.",["lost","have lost","had lost"],0,"yesterday → Past Simple."],
[4,"She ___ playing the piano when she was five.",["started","has started","starts"],0,"when she was five — минулий час."],
[4,"He didn’t ___ the answer, so he asked for help.",["know","knew","known"],0,"didn’t + V1."],
[5,"I ___ home when I saw an old friend.",["was walking","walked","had walked"],0,"Тривала дія, яку перервала коротка (saw)."],
[5,"While Mum ___ dinner, my brother broke a glass.",["was cooking","cooked","has cooked"],0,"while + Past Continuous — фонова дія."],
[5,"It ___ heavily when we left the café.",["was raining","rained","has rained"],0,"Фон у минулому → was + V-ing."],
[5,"The students ___ when the teacher came in.",["were talking","talked","have talked"],0,"Дія тривала в момент іншої минулої дії."],
[5,"What were you ___ when the lights went out?",["do","doing","done"],1,"were + you + V-ing."],
[6,"When we arrived at the cinema, the film had already ___.",["started","start","starting"],0,"had + V3."],
[6,"She was nervous because she had never ___ in public before.",["spoken","spoke","speak"],0,"had + V3."],
[6,"I couldn’t get in because I ___ my ticket at home.",["had left","left","was leaving"],0,"Дія раніше за іншу минулу дію → Past Perfect."],
[6,"She was happy because she ___ the exam.",["had passed","passes","will pass"],0,"Дія раніше за іншу минулу дію → had + V3."],
[6,"We were late because the bus ___ before we reached the stop.",["had gone","went","has gone"],0,"before + раніша дія → Past Perfect."],
[7,"I’m sure you ___ the exam if you work hard.",["will pass","pass","are passing"],0,"Впевнене передбачення → will + V1."],
[7,"The phone is ringing. I ___ it!",["will answer","answer","am answering"],0,"Спонтанне рішення → will."],
[7,"In 2050, people probably ___ on Mars.",["will live","live","have lived"],0,"probably + прогноз → will + V1."],
[7,"Next year I ___ 18 years old.",["will be","am","was"],0,"next year → will + V1."],
[7,"Don’t worry, I ___ tell anyone your secret.",["won’t","don’t","didn’t"],0,"Обіцянка → will not (won’t)."]
];
var QB=[
[0,"My dad ___ to work by bus every morning.",["goes","is going","went"],0,"every morning — регулярна дія."],
[0,"She usually ___ breakfast at 7 o’clock.",["has","is having","had"],0,"usually → Present Simple."],
[0,"Our teacher ___ a lot of homework on Fridays.",["gives","gave","is giving"],0,"on Fridays — регулярно."],
[1,"Be quiet! The baby ___ now.",["sleeps","is sleeping","slept"],1,"now — дія відбувається зараз."],
[1,"I ___ to music at the moment.",["listen","am listening","listened"],1,"at the moment → Present Continuous."],
[1,"Look! The boys ___ football in the yard.",["play","are playing","played"],1,"Look! — дія відбувається зараз."],
[2,"I have already ___ my homework.",["done","did","do"],0,"have + V3 (done)."],
[2,"She has never ___ sushi.",["eaten","ate","eat"],0,"never + has + V3."],
[2,"We have just ___ home.",["arrived","arrive","arriving"],0,"have just + V3."],
[3,"I ___ for you for an hour!",["have been waiting","wait","waited"],0,"for an hour + дія триває досі."],
[3,"He ___ football since morning.",["has been playing","plays","played"],0,"since morning → has been + V-ing."],
[3,"They ___ English for five years.",["have been learning","learn","learned"],0,"for five years → have been + V-ing."],
[4,"Yesterday I ___ my grandmother.",["visited","visit","have visited"],0,"yesterday → Past Simple."],
[4,"We ___ to the sea last summer.",["went","go","have gone"],0,"last summer → V2 (went)."],
[4,"She ___ a new phone two days ago.",["bought","buys","has bought"],0,"two days ago → Past Simple."],
[5,"At 9 o’clock yesterday I ___ TV.",["was watching","watched","am watching"],0,"Точний момент у минулому → was + V-ing."],
[5,"When I called, she ___ dinner.",["was cooking","cooks","has cooked"],0,"Дія тривала в момент дзвінка."],
[5,"They ___ football when it started to rain.",["were playing","play","have played"],0,"Тривала дія в минулому → were + V-ing."],
[6,"When I arrived, the lesson had already ___.",["started","start","starting"],0,"had + V3."],
[6,"She was sad because she ___ her key.",["had lost","loses","will lose"],0,"Дія раніше за іншу минулу → had + V3."],
[6,"Before he came, we ___ dinner.",["had eaten","eat","are eating"],0,"before + раніша дія → Past Perfect."],
[7,"Tomorrow I ___ my friends.",["will meet","met","meet"],0,"tomorrow → will + V1."],
[7,"I think it ___ tomorrow.",["will rain","rained","has rained"],0,"Прогноз → will + V1."],
[7,"Don’t worry, I ___ you.",["will help","helped","help"],0,"Обіцянка / рішення → will."],
[7,"Next year she ___ 18.",["will be","was","is being"],0,"next year → will + V1."]
];
var KEYS=["KeyQ","KeyP","KeyZ"],KL=["Q","P","Z"];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["setup","qgame","bgame","end"].forEach(function(x){$(x).classList.toggle("hide",x!==id)});$("menu").classList.toggle("hide",id==="setup"||id==="end")}
var G={mode:"quest",cnt:24,tm:20,sel:T.map(function(_,i){return i}),names:[],pts:[0,0,0],timer:null};
function stopT(){clearInterval(G.timer)}
function seg(id,key){$(id).onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call($(id).children,function(x){x.classList.remove("on")});b.classList.add("on");G[key]=+b.dataset.v}}
seg("cnt","cnt");seg("tm","tm");
$("modes").onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call($("modes").children,function(x){x.classList.remove("on")});b.classList.add("on");G.mode=b.dataset.m;$("qopt").classList.toggle("hide",G.mode!=="quest")};
$("names").innerHTML=[0,1,2].map(function(k){return '<div class="nm"><small>'+(k+1)+'-а команда · кнопка '+KL[k]+'</small><input type="text" id="nm'+k+'" value="Команда '+(k+1)+'" maxlength="16" style="border-left:6px solid var(--t'+k+')"></div>'}).join("");
$("tenses").innerHTML=T.map(function(t,i){return '<button class="chip on" data-i="'+i+'">'+t.n+'</button>'}).join("");
$("tenses").onclick=function(e){var b=e.target.closest("button");if(!b)return;b.classList.toggle("on");G.sel=[].map.call($("tenses").querySelectorAll(".on"),function(x){return +x.dataset.i});$("start").disabled=!G.sel.length};
function scoreHtml(cur,ban){return G.names.map(function(n,k){return '<div class="team'+(k===cur?' act':'')+((ban||[]).indexOf(k)>-1?' ban':'')+'" style="--c:var(--t'+k+')"><b>'+esc(n)+'</b><span>'+G.pts[k]+'</span></div>'}).join("")}
$("menu").onclick=function(){if(confirm("Вийти в меню? Поточна гра буде перервана."))stopT(),show("setup")};
$("again").onclick=function(){show("setup")};
$("start").onclick=function(){
 G.names=[0,1,2].map(function(k){return $("nm"+k).value||"Команда "+(k+1)});G.pts=[0,0,0];
 if(G.mode==="quest")startQ();else startB()};
function finish(withStats,stats){
 stopT();show("end");var m=Math.max.apply(null,G.pts),w=G.names.filter(function(_,k){return G.pts[k]===m});
 $("winner").textContent=w.length>1?"🤝 Нічия: "+w.join(", "):"🏆 Перемагає "+w[0]+"!";
 $("fScore").innerHTML=scoreHtml(-1);$("statCard").classList.toggle("hide",!withStats);
 if(withStats)$("stats").innerHTML=Object.keys(stats).map(function(k){var s=stats[k],p=Math.round(s.ok/s.all*100);return "<tr><td>"+T[k].n+"</td><td>"+s.ok+"/"+s.all+"</td><td>"+(p>=75?"🟢":p>=50?"🟡":"🔴")+"</td></tr>"}).join("")}

/* ===== QUEST ===== */
var A={qs:[],i:0,turn:0,streak:[0,0,0],st:{},left:0,locked:false};
function startQ(){
 var pool=shuffle(QQ.filter(function(q){return G.sel.indexOf(q[0])>-1})),out=[];
 while(out.length<G.cnt)out=out.concat(shuffle(pool));
 A.qs=out.slice(0,G.cnt);A.i=0;A.turn=0;A.streak=[0,0,0];A.st={};show("qgame");qRender()}
function qRender(){
 var q=A.qs[A.i];A.locked=false;
 $("qScore").innerHTML=scoreHtml(A.turn);$("qProg").textContent="Питання "+(A.i+1)+" з "+A.qs.length;
 $("qTurn").textContent="Хід: "+G.names[A.turn];$("qStreak").textContent=A.streak[A.turn]>1?"🔥 серія "+A.streak[A.turn]:"";
 $("qQ").innerHTML=esc(q[1]).replace("___",'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
 $("qOpts").innerHTML="";
 shuffle(q[2].map(function(t,k){return{t:t,ok:k===q[3]}})).forEach(function(o){var b=document.createElement("button");b.className="opt";b.textContent=o.t;b._ok=o.ok;b.onclick=function(){qAnswer(b,o.ok)};$("qOpts").appendChild(b)});
 $("qFb").classList.add("hide");$("qNext").classList.add("hide");
 A.left=G.tm;qTick();stopT();
 G.timer=setInterval(function(){A.left-=0.1;qTick();if(A.left<=0){stopT();qAnswer(null,false,true)}},100)}
function qTick(){$("qBar").style.width=Math.max(0,A.left/G.tm*100)+"%";$("qLeft").textContent="⏳ "+Math.max(0,Math.ceil(A.left))+" с"}
function qAnswer(btn,ok,timeout){
 if(A.locked)return;A.locked=true;stopT();
 var q=A.qs[A.i],t=q[0],gain=0;A.st[t]=A.st[t]||{ok:0,all:0};A.st[t].all++;
 if(ok){gain=10+Math.round(A.left/G.tm*5)+(A.streak[A.turn]>=2?5:0);G.pts[A.turn]+=gain;A.streak[A.turn]++;A.st[t].ok++}else A.streak[A.turn]=0;
 [].forEach.call($("qOpts").children,function(b){b.disabled=true;if(b._ok)b.classList.add("ok")});
 if(btn&&!ok)btn.classList.add("bad");
 $("qScore").innerHTML=scoreHtml(A.turn);
 $("qFb").innerHTML=(ok?"✅ <b>+"+gain+"</b>":timeout?"⏰ Час вийшов.":"❌")+'<br><span class="tag">'+T[t].n+'</span><code>'+T[t].f+'</code><br>'+esc(q[4]);
 $("qFb").classList.remove("hide");
 $("qNext").textContent=A.i===A.qs.length-1?"Результати 🏆":"Далі →";$("qNext").classList.remove("hide")}
$("qNext").onclick=function(){if(A.i===A.qs.length-1)return finish(true,A.st);A.i++;A.turn=(A.turn+1)%3;qRender()};

/* ===== BUZZER ===== */
var B={qs:[],i:0,state:"",cur:-1,ban:[],left:0};
function startB(){
 B.qs=shuffle(QB);B.i=0;
 $("bBuzz").innerHTML=G.names.map(function(n,k){return '<button class="bz" data-k="'+k+'" style="--c:var(--t'+k+')">'+esc(n)+'<small>клавіша '+KL[k]+'</small></button>'}).join("");
 show("bgame");bRender()}
function bScores(){$("bScore").innerHTML=scoreHtml(B.cur,B.ban)}
function bBtns(){[].forEach.call($("bBuzz").children,function(b){b.disabled=B.state!=="open"||B.ban.indexOf(+b.dataset.k)>-1})}
function bSetOpts(en){[].forEach.call($("bOpts").children,function(b){b.disabled=!en||b._used})}
function bRender(){
 var q=B.qs[B.i];B.state="open";B.cur=-1;B.ban=[];stopT();
 $("bProg").textContent="Питання "+(B.i+1)+" з "+B.qs.length;$("bLeft").textContent="";
 $("bQ").innerHTML=esc(q[1]).replace("___",'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
 $("bStatus").textContent="🔔 Натискайте кнопку!";$("bBarw").classList.add("hide");$("bOpts").innerHTML="";
 shuffle(q[2].map(function(t,k){return{t:t,ok:k===q[3]}})).forEach(function(o){var b=document.createElement("button");b.className="opt";b.textContent=o.t;b._ok=o.ok;b.onclick=function(){bPick(b)};$("bOpts").appendChild(b)});
 bSetOpts(false);$("bFb").classList.add("hide");$("bNext").classList.add("hide");$("bSkip").classList.remove("hide");bScores();bBtns()}
function buzz(k){
 if(B.state!=="open"||B.ban.indexOf(k)>-1||k>2)return;
 B.state="answer";B.cur=k;B.left=10;
 $("bStatus").innerHTML='<span style="color:var(--t'+k+')">🙋 Відповідає: '+esc(G.names[k])+'</span>';
 $("bBarw").classList.remove("hide");bSetOpts(true);bScores();bBtns();bTick();stopT();
 G.timer=setInterval(function(){B.left-=0.1;bTick();if(B.left<=0){stopT();bWrong(null)}},100)}
function bTick(){$("bBar").style.width=Math.max(0,B.left*10)+"%";$("bLeft").textContent="⏳ "+Math.max(0,Math.ceil(B.left))+" с"}
function bPick(b){if(B.state!=="answer")return;stopT();if(b._ok){G.pts[B.cur]+=10;bReveal("✅ "+esc(G.names[B.cur])+": +10 балів")}else bWrong(b)}
function bWrong(b){
 G.pts[B.cur]-=5;B.ban.push(B.cur);if(b){b.classList.add("bad");b._used=true}
 if(B.ban.length>=3){bReveal("❌ "+esc(G.names[B.cur])+": −5. Ніхто не відповів правильно.");return}
 var who=G.names[B.cur];B.state="open";B.cur=-1;$("bBarw").classList.add("hide");$("bLeft").textContent="";
 $("bStatus").textContent="❌ "+who+": −5. Хто ще? Натискайте!";bSetOpts(false);bScores();bBtns()}
function bReveal(msg){
 stopT();B.state="done";var q=B.qs[B.i],t=q[0];
 [].forEach.call($("bOpts").children,function(b){b.disabled=true;if(b._ok)b.classList.add("ok")});
 $("bStatus").innerHTML=msg;$("bBarw").classList.add("hide");$("bLeft").textContent="";
 $("bFb").innerHTML='<span class="tag">'+T[t].n+'</span><code>'+T[t].f+'</code><br>'+esc(q[4]);
 $("bFb").classList.remove("hide");$("bSkip").classList.add("hide");
 $("bNext").textContent=B.i===B.qs.length-1?"Результати 🏆":"Далі →";$("bNext").classList.remove("hide");bScores();bBtns()}
$("bSkip").onclick=function(){if(B.state==="open"||B.state==="answer")bReveal("Правильна відповідь:")};
function bNext(){if(B.state!=="done")return;if(B.i===B.qs.length-1)return finish(false);B.i++;bRender()}
$("bNext").onclick=bNext;
$("bBuzz").onclick=function(e){var b=e.target.closest("button");if(b)buzz(+b.dataset.k)};
document.addEventListener("keydown",function(e){
 if(e.repeat||$("bgame").classList.contains("hide"))return;
 var k=KEYS.indexOf(e.code);if(k>-1){e.preventDefault();buzz(k);return}
 if((e.code==="Enter"||e.code==="Space")&&B.state==="done"){e.preventDefault();bNext()}});
</script>
</body>
